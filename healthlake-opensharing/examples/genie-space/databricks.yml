bundle:
  name: healthlake-opensharing-genie

# Optional: a Genie space over one data store's catalog. Deploy it to the
# consumer workspace after scripts/configure-consumer.sh has created the
# catalog. Requires Databricks CLI >= 1.3.0 (genie_spaces bundle resource).

variables:
  catalog:
    description: Catalog created by scripts/configure-consumer.sh, e.g. healthlake_<data store>
  schema:
    description: FHIR schema inside that catalog (fhir in the default share layout)
    default: fhir
  warehouse_id:
    description: SQL warehouse the Genie space runs queries on; deploy.sh picks the first one when unset

targets:
  default:
    default: true

resources:
  genie_spaces:
    healthlake_fhir:
      title: "HealthLake FHIR (via OpenSharing)"
      description: "Ask questions over AWS HealthLake FHIR data, read in place (no copy) through OpenSharing. Observations are LOINC-coded; A1C is code 4548-4."
      warehouse_id: ${var.warehouse_id}
      serialized_space:
        version: 2
        config:
          sample_questions:
            - id: "1a2b3c4d5e6f40008000000000000001"
              question:
                - "How is average A1C trending by month?"
            - id: "1a2b3c4d5e6f40008000000000000002"
              question:
                - "How many patients do we have by gender?"
            - id: "1a2b3c4d5e6f40008000000000000003"
              question:
                - "What are the most common conditions recorded?"
            - id: "1a2b3c4d5e6f40008000000000000004"
              question:
                - "Show immunization counts by month"
        data_sources:
          tables:
            - identifier: ${var.catalog}.${var.schema}.condition
            - identifier: ${var.catalog}.${var.schema}.encounter
            - identifier: ${var.catalog}.${var.schema}.immunization
            - identifier: ${var.catalog}.${var.schema}.medicationrequest
            - identifier: ${var.catalog}.${var.schema}.observation
            - identifier: ${var.catalog}.${var.schema}.patient
        instructions:
          example_question_sqls:
            - id: "1a2b3c4d5e6f4000900000000000000a"
              question:
                - "How is average A1C trending by month?"
              sql:
                - "SELECT date_trunc('month', CAST(effectiveDateTime AS TIMESTAMP)) AS month, round(avg(valueQuantity.value), 2) AS avg_a1c, count(*) AS readings FROM ${var.catalog}.${var.schema}.observation WHERE code.coding[0].code = '4548-4' GROUP BY 1 ORDER BY 1"
            - id: "1a2b3c4d5e6f4000900000000000000b"
              question:
                - "How many patients do we have by gender?"
              sql:
                - "SELECT gender, count(*) AS patients FROM (SELECT * FROM ${var.catalog}.${var.schema}.patient QUALIFY row_number() OVER (PARTITION BY id ORDER BY CAST(meta.lastUpdated AS TIMESTAMP) DESC) = 1 AND meta.versionId IS NOT NULL) GROUP BY gender ORDER BY patients DESC"
