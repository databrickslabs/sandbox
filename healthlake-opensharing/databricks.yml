bundle:
  name: healthlake-opensharing

variables:
  app_name:
    description: Databricks App name (lowercase letters, numbers, hyphens; max 30 characters)
    default: healthlake-opensharing
  aws_region:
    description: Region of the HealthLake data stores
  aws_role_arns:
    description: Comma-separated IAM roles the app assumes with its own Databricks OIDC token, one per AWS account
  recipient_sp_application_id:
    description: Service principal Unity Catalog authenticates as; the only caller the server accepts
  layout:
    description: "share = one share (catalog) per data store; schema = one share with a schema per data store (up to ~45 stores)"
    default: share
  stores:
    description: "Optional comma-separated name=datastore list to expose (and rename); empty exposes every ACTIVE data store"
    default: ""
  instances:
    description: App instances (1-5); 2 or more gives zero-downtime redeploys
    default: 1

resources:
  apps:
    healthlake_opensharing:
      name: ${var.app_name}
      description: OpenSharing server for AWS HealthLake via Lake Formation credential vending
      source_code_path: ./app
      compute_min_instances: ${var.instances}
      compute_max_instances: ${var.instances}
      config:
        command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
        env:
          - name: AWS_REGION
            value: ${var.aws_region}
          - name: AWS_ROLE_ARNS
            value: ${var.aws_role_arns}
          - name: LAYOUT
            value: ${var.layout}
          - name: STORES
            value: ${var.stores}
          - name: ALLOWED_CALLERS
            value: ${var.recipient_sp_application_id}
      permissions:
        - service_principal_name: ${var.recipient_sp_application_id}
          level: CAN_USE

targets:
  default:
    default: true
